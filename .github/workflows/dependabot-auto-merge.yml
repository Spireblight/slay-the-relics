name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Merge Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBERS=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[] | select(.state == "open" and .draft == false and .user.login == "dependabot[bot]" and .head.repo.full_name == env.REPO) | .number')

          if [ -z "$PR_NUMBERS" ]; then
            echo "No open Dependabot PRs found for ${HEAD_SHA}."
            exit 0
          fi

          for PR_NUMBER in $PR_NUMBERS; do
            echo "Merging Dependabot PR #${PR_NUMBER}..."
            gh pr merge "${PR_NUMBER}" --repo "${REPO}" --rebase --delete-branch
          done
